name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Verify dist/ is up-to-date
        run: |
          bun run build
          git diff --exit-code dist/ \
            || (echo "::error::dist/index.js is out of date — run 'bun run build' and commit" && exit 1)
      - name: smoke-test bundle on Node
        run: |
          echo '{"session_id":"ci","transcript_path":"/tmp/no","model":{"id":"glm-5:cloud","display_name":"glm-5:cloud"},"workspace":{"current_dir":"."},"context_window":{"used_percentage":10}}' | node dist/index.js
