name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun run build
      - name: Verify dist/ is up-to-date
        run: |
          bun run build
          git diff --exit-code dist/ \
            || (echo "::error::dist/index.js is out of date — run 'bun run build' and commit" && exit 1)
      - run: bun test
      - name: smoke-test bundle on Node
        run: |
          echo '{"session_id":"ci","transcript_path":"/tmp/no","model":{"id":"glm-5:cloud","display_name":"glm-5:cloud"},"workspace":{"current_dir":"."},"context_window":{"used_percentage":10}}' | node dist/index.js

  fresh-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Simulate marketplace install (committed files only, no build)
        run: |
          TMP=$(mktemp -d)
          git ls-files -z | xargs -0 -I{} cp --parents {} "$TMP"
          cd "$TMP"
          ls dist/index.js
      - name: Run committed bundle as if installed
        run: |
          TMP=$(mktemp -d)
          git ls-files -z | xargs -0 -I{} cp --parents {} "$TMP"
          cd "$TMP"
          echo '{"session_id":"smoke","transcript_path":"/tmp/no","model":{"id":"glm-5:cloud","display_name":"glm-5:cloud"},"workspace":{"current_dir":"'"$PWD"'"},"context_window":{"used_percentage":50}}' \
            | node dist/index.js
